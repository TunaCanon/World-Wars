<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Nullius - Strateji Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Üst Bilgi Paneli -->
        <header id="header-panel">
            <h1>Terra Nullius</h1>
            <div id="stats">
                <span>Altın: <strong id="gold-val">100</strong></span>
                <span>Asker: <strong id="troops-val">10</strong></span>
                <span>Bölge: <strong id="territory-val">1</strong></span>
            </div>
        </header>

        <!-- Oyun Alanı / Harita -->
        <main id="main-map">
            <div id="grid-container">
                <!-- Harita kareleri JavaScript ile dinamik eklenecek -->
            </div>
        </main>

        <!-- Kontrol / Eylem Paneli -->
        <footer id="control-panel">
            <button id="btn-recruit" class="game-btn">Asker Eğit (5 Altın)</button>
            <button id="btn-expand" class="game-btn">Bölgeyi Genişlet (20 Altın)</button>
            <button id="btn-end-turn" class="game-btn secondary">Turu Bitir</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
